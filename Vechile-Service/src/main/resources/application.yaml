spring:
  application:
    name: Vechile-Service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

management:
  endpoint:
    web:
      exposure:
        include: health, info, metrics
  health:
    show-details: always

server:
  port: ${PORT:8081}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
